<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ERD User - Sistem Kantin Cerdas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#fff; font-family:Arial,sans-serif; display:flex; justify-content:center; padding:30px; }
svg { border:1px solid #ccc; }
.entity { fill:#F5A623; stroke:#D4880F; stroke-width:2; }
.attr { fill:#4A90D9; stroke:#2E6BA6; stroke-width:1.5; }
.pk { fill:#2E6BA6; stroke:#1A4A7A; stroke-width:2; }
.rel { fill:#7ED321; stroke:#5DA018; stroke-width:2; }
.label { font-size:11px; fill:#fff; text-anchor:middle; dominant-baseline:central; font-weight:bold; }
.elabel { font-size:13px; fill:#fff; text-anchor:middle; dominant-baseline:central; font-weight:bold; }
.rlabel { font-size:10px; fill:#fff; text-anchor:middle; dominant-baseline:central; font-weight:bold; }
.line { stroke:#333; stroke-width:1.5; fill:none; }
.card { font-size:10px; fill:#333; text-anchor:middle; font-weight:bold; }
.title { font-size:18px; fill:#333; text-anchor:middle; font-weight:bold; }
</style>
</head>
